name: Vérification du site et du GitBook

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs
      - run: node --test scripts/check.test.mjs
      - run: node scripts/check-gitbook.mjs
      - run: node --test scripts/check-gitbook.test.mjs
